plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.144' apply false
}

subprojects {
    apply plugin: 'java'

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // AE2 for both loaders
        maven { name = 'ModMaven'; url = 'https://modmaven.dev/' }
        mavenCentral()
    }

    // 1.20.1 is a Java 17 game: emit Java 17 bytecode against the Java 17 API (--release), built and run with
    // a JDK 21 toolchain (Forge 47.4 and Fabric both run 1.20.1 on 21; no JDK 17 needed on the dev machine).
    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = "UTF-8"
        it.options.release.set(17)
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }
}
